
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WattWise - Smart Electricity Meter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <section class="image-section">
      <h1>Reduce your Bill<br>Increase saving</h1>
      <img src="light.jpeg" alt="Save electricity">
      <p class="image-caption">Smart Energy. Better Tomorrow.</p>
    </section>

    <section class="form-section">

      <div class="logo">
        <span class="logo-icon">◆</span>
      </div>

      <h2 id="formTitle">Create Your Account</h2>

      <p class="subtitle" id="formSubtitle">
        Join WattWise and monitor your electricity consumption.
      </p>

      <hr>

      <form id="signupForm">

        <div id="profileFields">

          <label for="name">Full Name</label>
          <input
            id="name"
            type="text"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

          <label for="meterNumber">Electricity Meter Number</label>
          <input
            id="meterNumber"
            type="text"
            placeholder="Enter meter number"
            required
          >

          <label for="state">State / Union Territory</label>
          <select id="state" name="state" required>
            <option value="">Select your state</option>
            <option>Andhra Pradesh</option>
            <option>Arunachal Pradesh</option>
            <option>Assam</option>
            <option>Bihar</option>
            <option>Chhattisgarh</option>
            <option>Goa</option>
            <option>Gujarat</option>
            <option>Haryana</option>
            <option>Himachal Pradesh</option>
            <option>Jharkhand</option>
            <option>Karnataka</option>
            <option>Kerala</option>
            <option>Madhya Pradesh</option>
            <option>Maharashtra</option>
            <option>Manipur</option>
            <option>Meghalaya</option>
            <option>Mizoram</option>
            <option>Nagaland</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Rajasthan</option>
            <option>Sikkim</option>
            <option>Tamil Nadu</option>
            <option>Telangana</option>
            <option>Tripura</option>
            <option>Uttar Pradesh</option>
            <option>Uttarakhand</option>
            <option>West Bengal</option>
            <option>Andaman and Nicobar Islands</option>
            <option>Chandigarh</option>
            <option>Dadra and Nagar Haveli and Daman and Diu</option>
            <option>Delhi</option>
            <option>Jammu and Kashmir</option>
            <option>Ladakh</option>
            <option>Lakshadweep</option>
            <option>Puducherry</option>
          </select>

          <label for="city">City</label>
          <select id="city" name="city" required disabled>
            <option value="">First select your state</option>
          </select>

        </div>

        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <div id="passwordFields">

          <label for="password">Password</label>

          <div class="password-box">
            <input
              id="password"
              type="password"
              placeholder="Enter password"
              minlength="6"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="eye"
              data-target="password"
              aria-label="Show password"
            >Show</button>
          </div>

          <div id="confirmGroup">

            <label for="confirmPassword">Confirm Password</label>

            <div class="password-box">
              <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm password"
                autocomplete="new-password"
                required
              >
              <button
                type="button"
                class="eye"
                data-target="confirmPassword"
                aria-label="Show confirm password"
              >Show</button>
            </div>

          </div>

          <div id="forgotPasswordContainer" hidden>
            <button
              type="button"
              id="forgotPasswordBtn"
              class="forgot-password-btn"
            ><a href="reset.html" class="forgot-password">
    Forgot Password?
</a></button>
          </div>

        </div>

        <p id="message" role="status" aria-live="polite"></p>

        <button type="submit" class="submit-btn" id="submitBtn">
          Create Account
        </button>

      </form>

      <p class="login-text">
        <span id="switchText">Already have an account?</span>
        <button type="button" id="switchBtn">Login</button>
      </p>

      <div class="divider" id="socialDivider" hidden>
        <span>Or</span>
      </div>

      <div class="social-buttons">
        <button
          type="button"
          class="social-btn"
          id="googleBtn"
          hidden
        >
          <span class="google">G</span>
          Continue with Google
        </button>
      </div>

    </section>
  </main>


  <!-- GOOGLE PROFILE COMPLETION MODAL -->

  <div
    class="google-profile-overlay"
    id="googleProfileOverlay"
    hidden
  >

    <div class="google-profile-modal">

      <div class="google-profile-icon">⚡</div>

      <h2>Complete Your Profile</h2>

      <p>
        Just a few more details to set up your WattWise account.
      </p>

      <form id="googleProfileForm">

        <label for="googleName">Full Name</label>
        <input
          type="text"
          id="googleName"
          readonly
        >

        <label for="googleEmail">Email Address</label>
        <input
          type="email"
          id="googleEmail"
          readonly
        >

        <label for="googleMeter">Electricity Meter Number</label>
        <input
          type="text"
          id="googleMeter"
          placeholder="Enter your meter number"
          required
        >

        <label for="googleState">State / Union Territory</label>
        <select id="googleState" required>
          <option value="">Select your state</option>
          <option>Andhra Pradesh</option>
          <option>Arunachal Pradesh</option>
          <option>Assam</option>
          <option>Bihar</option>
          <option>Chhattisgarh</option>
          <option>Goa</option>
          <option>Gujarat</option>
          <option>Haryana</option>
          <option>Himachal Pradesh</option>
          <option>Jharkhand</option>
          <option>Karnataka</option>
          <option>Kerala</option>
          <option>Madhya Pradesh</option>
          <option>Maharashtra</option>
          <option>Manipur</option>
          <option>Meghalaya</option>
          <option>Mizoram</option>
          <option>Nagaland</option>
          <option>Odisha</option>
          <option>Punjab</option>
          <option>Rajasthan</option>
          <option>Sikkim</option>
          <option>Tamil Nadu</option>
          <option>Telangana</option>
          <option>Tripura</option>
          <option>Uttar Pradesh</option>
          <option>Uttarakhand</option>
          <option>West Bengal</option>
          <option>Andaman and Nicobar Islands</option>
          <option>Chandigarh</option>
          <option>Dadra and Nagar Haveli and Daman and Diu</option>
          <option>Delhi</option>
          <option>Jammu and Kashmir</option>
          <option>Ladakh</option>
          <option>Lakshadweep</option>
          <option>Puducherry</option>
        </select>

        <label for="googleCity">City</label>
        <select id="googleCity" required disabled>
          <option value="">First select your state</option>
        </select>

        <p
          id="googleProfileMessage"
          role="status"
          aria-live="polite"
        ></p>

        <button type="submit" id="saveGoogleProfile">
          Save Profile
        </button>

      </form>

    </div>

  </div>


  <script type="module" src="script.js"></script>

</body>
</html>
